<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="六字口诀：将不已在被动">
  <rect width="1200" height="520" fill="#0b1017"/>

  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="70" y="78" fill="#6fb3c9" font-size="16" letter-spacing="8">THE SIX-CHARACTER KEY</text>
    <text x="70" y="126" fill="#f0f4f8" font-size="34" font-weight="700" letter-spacing="2">动词时态语态的总和形式</text>

    <!-- six tiles -->
    <g>
      <g transform="translate(70,180)">
        <rect width="150" height="170" rx="8" fill="#111a26" stroke="#2c4a63"/>
        <text x="75" y="86" text-anchor="middle" fill="#f0f4f8" font-size="66" font-weight="700">将</text>
        <text x="75" y="128" text-anchor="middle" fill="#d8a24a" font-size="17" letter-spacing="1">vil</text>
        <text x="75" y="152" text-anchor="middle" fill="#7f93a6" font-size="12">将来</text>
      </g>
      <g transform="translate(238,180)">
        <rect width="150" height="170" rx="8" fill="#111a26" stroke="#2c4a63"/>
        <text x="75" y="86" text-anchor="middle" fill="#f0f4f8" font-size="66" font-weight="700">不</text>
        <text x="75" y="128" text-anchor="middle" fill="#d8a24a" font-size="17" letter-spacing="1">ba</text>
        <text x="75" y="152" text-anchor="middle" fill="#7f93a6" font-size="12">否定</text>
      </g>
      <g transform="translate(406,180)">
        <rect width="150" height="170" rx="8" fill="#111a26" stroke="#2c4a63"/>
        <text x="75" y="86" text-anchor="middle" fill="#f0f4f8" font-size="66" font-weight="700">已</text>
        <text x="75" y="128" text-anchor="middle" fill="#d8a24a" font-size="17" letter-spacing="1">deja</text>
        <text x="75" y="152" text-anchor="middle" fill="#7f93a6" font-size="12">完成</text>
      </g>
      <g transform="translate(574,180)">
        <rect width="150" height="170" rx="8" fill="#111a26" stroke="#2c4a63"/>
        <text x="75" y="86" text-anchor="middle" fill="#f0f4f8" font-size="66" font-weight="700">在</text>
        <text x="75" y="128" text-anchor="middle" fill="#d8a24a" font-size="17" letter-spacing="1">jen</text>
        <text x="75" y="152" text-anchor="middle" fill="#7f93a6" font-size="12">进行</text>
      </g>
      <g transform="translate(742,180)">
        <rect width="150" height="170" rx="8" fill="#111a26" stroke="#2c4a63"/>
        <text x="75" y="86" text-anchor="middle" fill="#f0f4f8" font-size="66" font-weight="700">被</text>
        <text x="75" y="128" text-anchor="middle" fill="#d8a24a" font-size="17" letter-spacing="1">ez / ed</text>
        <text x="75" y="152" text-anchor="middle" fill="#7f93a6" font-size="12">被动</text>
      </g>
      <g transform="translate(910,180)">
        <rect width="220" height="170" rx="8" fill="#1a1409" stroke="#d8a24a" stroke-opacity="0.8"/>
        <text x="110" y="86" text-anchor="middle" fill="#f6efe2" font-size="66" font-weight="700">动</text>
        <text x="110" y="128" text-anchor="middle" fill="#d8a24a" font-size="17" letter-spacing="1">verb(-ed)</text>
        <text x="110" y="152" text-anchor="middle" fill="#a08a63" font-size="12">动词本体</text>
      </g>
    </g>

    <text x="70" y="420" fill="#e9eef4" font-size="30" letter-spacing="12">江湖已在波动</text>
    <text x="70" y="452" fill="#6b8298" font-size="14" letter-spacing="6">JIANG HU YI ZAI BO DONG</text>
    <text x="70" y="492" fill="#4d6377" font-size="13" letter-spacing="2">念一遍就记住了：这是一句预言，也是一条语法。</text>
  </g>
</svg>
