# Site settings
title: A-07 的私人空间
SEOTitle: A-07 的私人空间 · ETO
header-img: img/santi/hero.jpg
email:
description: '档案室 A-07 的个人空间：观测记录、碎碎念、批注，和一个不太敢署名的人。'
keyword: '三体语, Klovien, 国际语, ETO, 科幻'
url: 'https://yenchiu.com' # your host, for absolute URL（站点实际由自定义域名 yenchiu.com/blog-v1/ 提供；baseurl 由 Pages 部署时注入）
baseurl: '' # for example, '/blog' if your blog hosted on 'host/blog'
github_repo: 'https://github.com/yen-chiu/blog-v1.git' # you code repository

# Sidebar settings
sidebar: true # whether or not using Sidebar.
sidebar-about-description: '上班归档，下班写字。'
sidebar-avatar: /img/santi/eto-icon.png # use absolute URL, seeing it's used in both `/` and `/about/`

# SNS settings
RSS: false
# weibo_username:
# zhihu_username:
# github_username：
# facebook_username:
# jianshu_username:
# twitter_username:

# Build settings
# from 2016, 'pygments' is unsupported on GitHub Pages. Use 'rouge' for highlighting instead.
permalink: pretty
paginate: 10
exclude: ['less', 'node_modules', 'Gruntfile.js', 'package.json', 'README.md']
anchorjs: true # if you want to customize anchor. check out line:181 of `post.html`

# Gems
# from PR#40, to support local preview for Jekyll 3.0
gems: [jekyll-paginate]
plugins:
    - jekyll-paginate

# Markdown settings
# replace redcarpet to kramdown,
# although redcarpet can auto highlight code, the lack of header-id make the catalog impossible, so I switch to kramdown
# document: http://jekyllrb.com/docs/configuration/#kramdown
markdown: kramdown
highlighter: rouge
kramdown:
    input: GFM # use Github Flavored Markdown !important

# 评论系统
# Disqus（https://disqus.com/）
# disqus_username: your_disqus_shortname

# Gitalk
# gitalk:
#   enable: true    #是否开启Gitalk评论
#   clientID: your_client_id #生成的客户端ID
#   clientSecret: your_client_secret #生成的clientSecret（公开仓库中请勿填写真实值）
#   repo: yen-chiu.github.io    #仓库名称
#   owner: yen-chiu    #github用户名
#   admin: yen-chiu
#   distractionFreeMode: true #是否启用类似FB的阴影遮罩

# 统计

# Analytics settings
# Baidu Analytics
# ba_track_id: b50bf2b12b5338a1845e33832976fd68

# Google Analytics
# ga_track_id: 'UA-90855596-1'            # Format: UA-xxxxxx-xx
# ga_domain: auto               # 默认的是 auto, 这里我是自定义了的域名，你如果没有自己的域名，需要改成auto

# Featured Tags
featured-tags: true # 是否使用首页标签
featured-condition-size: 1 # 相同标签数量大于这个数，才会出现在首页

# Progressive Web Apps
chrome-tab-theme-color: '#05070a'
service-worker: true

# 友情链接，请尽量不要删除，谢谢！
friends:
